version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: civicconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: civicconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civicconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: civicconnect_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/civicconnect?schema=public
      JWT_SECRET: civicconnect_production_jwt_secret_token_key_2026
      COOKIE_SECRET: civicconnect_production_cookie_secret_key_2026
      CLIENT_URL: http://localhost:5173
      UPLOAD_DIRECTORY: uploads
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: civicconnect_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
  server_uploads:
